server {
    server_name inex.hnatax.in;

    location / {
        proxy_pass http://localhost:3050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass https://inext.frappe.cloud/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host inext.frappe.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /pg-api/ {
        proxy_pass http://localhost:3060/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/inex.hnatax.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/inex.hnatax.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = inex.hnatax.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name inex.hnatax.in;
    return 404; # managed by Certbot


}
